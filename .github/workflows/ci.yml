# The dataset is not committed, so CI runs what does not need it: the policy rules, the
# permission boundary, the MCP envelope parser and the external lookup (the data-backed
# tests skip themselves), plus a type-check and build of the console. The full suite,
# the backtest and the Playwright pass run locally against build/fraud.db.
name: ci
on: [push, pull_request]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --dev
      - run: uv run pytest -q

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard-app/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npx vite build
