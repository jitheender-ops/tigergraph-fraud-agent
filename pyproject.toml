[project]
name = "fraud-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Manapuram Jitheender Kumar", email = "jitheender12072007@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "fastapi>=0.141.1",
    "fastembed>=0.8.0",
    "openai>=3.16.2",
    "pandas>=3.0.6",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.3",
    "pytigergraph>=2.0.4",
    "tigergraph-mcp>=1.0.3",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
fraud-agent = "fraud_agent:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
